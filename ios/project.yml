# XcodeGen spec for the glasses companion app. Generate with: xcodegen generate (in ios/)
name: GreenplateCrew
options:
  bundleIdPrefix: ai.greenplate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GreenplateCrew:
    type: application
    platform: iOS
    sources: [Crew]
    info:
      path: Crew/Info.plist
    entitlements:
      path: Crew/Crew.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.greenplate.crew
        PRODUCT_NAME: Kitchen Crew
        INFOPLIST_FILE: Crew/Info.plist
        CODE_SIGN_ENTITLEMENTS: Crew/Crew.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATInputs
      - package: MWDAT
        product: MWDATSpeech
