# Build and upload to TestFlight (internal testers only). Archive is ad-hoc signed (no certificate per
# run: that hit Apple's certificate limit on 2026-10-27, entitlements kept); the export re-signs with the
# cloud-managed distribution certificate,
# driven by an App Store Connect API key. Needs three repository secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (the .p8 file, base64). The key needs the Admin role
#   the first time, so Xcode can create the distribution certificate and profile in the cloud.
name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TEAM_ID: WL2WQBM43Q
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          [ -n "$K" ] && [ -n "$I" ] && [ -n "$P" ] || { echo "::error::Set ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8_BASE64 in the repo secrets"; exit 1; }

      - name: Pick the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Write the API key
        env:
          P: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$P" | base64 --decode > "$RUNNER_TEMP/asc/key.p8"
          chmod 600 "$RUNNER_TEMP/asc/key.p8"

      - name: Generate the Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate

      - name: Check the app's settings survived
        working-directory: ios
        run: |
          for k in MWDAT NSCameraUsageDescription NSMicrophoneUsageDescription NSBluetoothAlwaysUsageDescription CFBundleIconName; do
            grep -q "<key>$k</key>" Crew/Info.plist || { echo "::error::Info.plist lost $k"; exit 1; }
          done
          grep -q HotspotConfiguration Crew/Crew.entitlements || { echo "::error::entitlements lost Hotspot"; exit 1; }

      - name: Build in the crew service address and app token
        working-directory: ios
        env:
          URL: ${{ vars.CREW_SERVICE_URL }}
          TOKEN: ${{ secrets.CREW_APP_TOKEN }}
        run: |
          # Written into the build's copy of Info.plist only; nothing is committed.
          [ -n "$URL" ] && /usr/libexec/PlistBuddy -c "Add :CrewServiceURL string $URL" Crew/Info.plist || echo "no CREW_SERVICE_URL variable"
          [ -n "$TOKEN" ] && /usr/libexec/PlistBuddy -c "Add :CrewAppToken string $TOKEN" Crew/Info.plist || echo "no CREW_APP_TOKEN secret"

      - name: Archive (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          BUILD=$((100 + ${{ github.run_number }}))
          xcodebuild archive \
            -project GreenplateCrew.xcodeproj -scheme GreenplateCrew -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Crew.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION="$BUILD" \
            2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          P=build/Crew.xcarchive/Products/Applications/*.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :MWDAT:AppLinkURLScheme" $P
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" $P
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" $P
          # An unsigned archive carries no entitlements, so stamp them in with a local ad-hoc
          # signature; the export re-signs for distribution and keeps them.
          APP=$(ls -d build/Crew.xcarchive/Products/Applications/*.app)
          codesign --force --sign - --entitlements Crew/Crew.entitlements --generate-entitlement-der "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q HotspotConfiguration

      - name: Export signed for distribution, and check it
        working-directory: ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          sed 's#<string>upload</string>#<string>export</string>#' ci/ExportOptions.plist > build/ExportLocal.plist
          xcodebuild -exportArchive \
            -archivePath build/Crew.xcarchive -exportOptionsPlist build/ExportLocal.plist -exportPath build/local \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            2>&1 | tee export-local.log | grep -E "error:|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" export-local.log
          mkdir -p build/ipa && unzip -q -o build/local/*.ipa -d build/ipa
          APP=$(ls -d build/ipa/Payload/*.app)
          codesign -d --entitlements - "$APP" 2>/dev/null | tee entitlements.txt | grep -q HotspotConfiguration || { echo "::error::exported app has no Hotspot entitlement"; cat entitlements.txt; exit 1; }
          codesign -dv "$APP" 2>&1 | grep -E "Authority=Apple Distribution|TeamIdentifier" 

      - name: Upload to TestFlight
        working-directory: ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Crew.xcarchive -exportOptionsPlist ci/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            2>&1 | tee export.log | grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/export-local.log
            ios/entitlements.txt
            ios/export.log
